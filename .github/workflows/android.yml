name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create minimal Android project
        run: |
          mkdir -p app/src/main/java/com/example/telegramwebdesktop
          mkdir -p app/src/main/res/values
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "TelegramWebDesktop"
          include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.telegramwebdesktop'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.telegramwebdesktop'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies {
              implementation 'androidx.biometric:biometric:1.1.0'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="Telegram Web Desktop" android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/example/telegramwebdesktop/MainActivity.kt <<'EOF'
          package com.example.telegramwebdesktop
          import android.os.Bundle
          import android.view.WindowManager
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.biometric.BiometricManager
          import androidx.biometric.BiometricPrompt
          import androidx.core.content.ContextCompat
          import android.content.Context
          import android.content.Intent
          import android.provider.Settings
          import android.view.View
          import android.webkit.WebSettings
          import android.app.Activity
          import android.app.AlertDialog
          import android.widget.EditText
          import android.text.InputType
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.TextView
          import android.view.ViewGroup
          import android.content.SharedPreferences
          class MainActivity : Activity() {
              private lateinit var web: WebView
              private val prefs by lazy { getSharedPreferences("app_lock", Context.MODE_PRIVATE) }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)
                  if (prefs.getBoolean("lock_enabled", false)) { askUnlock(); return }
                  showApp()
              }
              private fun askUnlock() {
                  val executor = ContextCompat.getMainExecutor(this)
                  val prompt = BiometricPrompt(this, executor, object: BiometricPrompt.AuthenticationCallback() {
                      override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) { showApp() }
                      override fun onAuthenticationError(errorCode: Int, errString: CharSequence) { askPin() }
                  })
                  val info = BiometricPrompt.PromptInfo.Builder().setTitle("Unlock Telegram Web").setSubtitle("Use fingerprint, face, or device PIN").setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_WEAK or BiometricManager.Authenticators.DEVICE_CREDENTIAL).build()
                  try { prompt.authenticate(info) } catch (_: Exception) { askPin() }
              }
              private fun askPin() {
                  val input = EditText(this); input.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  AlertDialog.Builder(this).setTitle("App password").setView(input).setCancelable(false)
                      .setPositiveButton("Unlock") { _, _ -> if (input.text.toString() == prefs.getString("pin", "")) showApp() else { Toast.makeText(this, "Wrong password", Toast.LENGTH_SHORT).show(); askPin() } }.show()
              }
              private fun showApp() {
                  val root = LinearLayout(this); root.orientation = LinearLayout.VERTICAL
                  val bar = LinearLayout(this); bar.orientation = LinearLayout.HORIZONTAL
                  fun btn(label: String, action: () -> Unit) { val b=Button(this); b.text=label; bar.addView(b, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)); b.setOnClickListener { action() } }
                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.cacheMode = WebSettings.LOAD_DEFAULT
                  web.settings.userAgentString = web.settings.userAgentString + " Desktop"
                  web.webViewClient = WebViewClient()
                  web.webChromeClient = WebChromeClient()
                  CookieManager.getInstance().setAcceptCookie(true)
                  btn("Lock") { setLock() }
                  btn("Incognito") { incognito() }
                  root.addView(bar); root.addView(web, LinearLayout.LayoutParams(-1,0,1f))
                  setContentView(root)
                  web.loadUrl("https://web.telegram.org/")
              }
              private fun setLock() {
                  val input=EditText(this); input.hint="Set app password"; input.inputType=InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  AlertDialog.Builder(this).setTitle("Set app lock").setView(input).setPositiveButton("Save") { _, _ -> val p=input.text.toString(); if(p.length>=4) { prefs.edit().putString("pin",p).putBoolean("lock_enabled",true).apply(); Toast.makeText(this,"Lock enabled",Toast.LENGTH_SHORT).show() } else Toast.makeText(this,"Use at least 4 characters",Toast.LENGTH_SHORT).show() }.setNegativeButton("Cancel",null).show()
              }
              private fun incognito() {
                  web.stopLoading(); web.loadUrl("about:blank")
                  web.clearHistory(); web.clearCache(true); web.clearFormData()
                  CookieManager.getInstance().removeAllCookies { CookieManager.getInstance().flush() }
                  Toast.makeText(this,"Temporary web data cleared. Open Telegram Web again for a fresh session.",Toast.LENGTH_LONG).show()
                  web.loadUrl("https://web.telegram.org/")
              }
              override fun onBackPressed() { if (::web.isInitialized && web.canGoBack()) web.goBack() else super.onBackPressed() }
          }
          EOF
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TelegramWebDesktop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk